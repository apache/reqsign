[package]
name = "reqsign-http-message-signatures"
version = "3.0.0"

categories = ["authentication", "web-programming::http-client"]
description = "RFC 9421 HTTP Message Signatures for reqsign."

edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
http = { workspace = true }
reqsign-core = { workspace = true }

# Enable Jiff's JavaScript clock for the wasm-bindgen-hosted target.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
jiff = { workspace = true, features = ["js"] }

[dev-dependencies]
reqsign-crypto-rustcrypto = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = { version = "0.3" }
