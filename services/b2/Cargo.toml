[package]
name = "reqsign-b2"
version = "1.0.0"

description = "Backblaze B2 authentication implementation for reqsign."

edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bytes = { workspace = true }
http = { workspace = true }
log = { workspace = true }
reqsign-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Enable Jiff's JavaScript clock for the wasm-bindgen-hosted target. B2
# authorization-token lifetime checks use the existing reqsign-core
# Timestamp::now() clock.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
jiff = { workspace = true, features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
reqsign-http-send-reqwest = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = { version = "0.3" }
