[package]
name = "reqsign-oauth2"
version = "1.0.0"

description = "Shared RFC 6749 refresh-token grants and Bearer tokens for reqsign."

edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
asyncband = { workspace = true }
form_urlencoded = { workspace = true }
http = { workspace = true }
reqsign-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Enable Jiff's JavaScript clock for the wasm-bindgen-hosted target. The
# existing reqsign-core Timestamp::now() then reads time from the JS host.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
jiff = { workspace = true, features = ["js"] }

[dev-dependencies]
asyncband = { workspace = true, features = ["oneshot"] }
bytes = { workspace = true }
futures = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = { version = "0.3" }
