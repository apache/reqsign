[package]
name = "reqsign-crypto-rustcrypto"
version = "3.3.4"

categories = ["authentication", "cryptography"]
description = "RustCrypto backend for reqsign."

edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
hmac = { workspace = true }
p256 = { workspace = true }
reqsign-core = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aes-gcm = { workspace = true, default-features = false, features = ["aes", "alloc"] }
getrandom = { workspace = true }
rsa = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
