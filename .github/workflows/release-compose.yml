name: Compose source release

on:
  push:
    tags:
      - "v*.*.*-rc.*"
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".asf.yaml"
      - ".github/workflows/release-compose.yml"
      - "release/scripts/**"

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  LC_ALL: C

concurrency:
  group: source-release-${{ github.event_name == 'pull_request' && github.event.number || 'compose' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose:
    name: Compose source release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
      archive: ${{ steps.source.outputs.archive }}
      sha512: ${{ steps.source.outputs.sha512 }}
      artifact-id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test release scripts
        run: python3 -m unittest discover -s release/scripts -p "test_*.py" -v
      - id: source
        name: Compose reproducible source archive
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          package_version="$(git show "${commit}:reqsign/Cargo.toml" | python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["package"]["version"])')"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc\.([1-9][0-9]*)$ ]]; then
              echo "::error::Expected an RC tag named vX.Y.Z-rc.N with a positive RC number."
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
            if [[ "${version}" != "${package_version}" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match reqsign/Cargo.toml version ${package_version}."
              exit 1
            fi
            if [[ "$(git rev-parse "${GITHUB_REF}^{commit}")" != "${commit}" ]]; then
              echo "::error::Checked-out commit ${commit} does not match ${GITHUB_REF}."
              exit 1
            fi
            git fetch --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/heads/release/*:refs/remotes/origin/release/*" \
              "+refs/heads/rel/*:refs/remotes/origin/rel/*"
            if ! git branch -r --contains "${commit}" --format='%(refname:short)' \
              | grep -Eq '^(origin/main|origin/release/.+|origin/rel/.+)$'; then
              echo "::error::Commit ${commit} is not contained in origin/main, origin/release/*, or origin/rel/*."
              exit 1
            fi
          else
            version="${package_version}"
          fi
          if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::The package must have a stable X.Y.Z version, got '${version}'."
            exit 1
          fi
          archive="apache-reqsign-${version}.tar.gz"
          python3 release/scripts/compose_source.py \
            --revision "${commit}" \
            --version "${version}" \
            --output "${RUNNER_TEMP}/repro"
          mkdir -p "${RUNNER_TEMP}/source"
          cp "${RUNNER_TEMP}/repro/${archive}" "${RUNNER_TEMP}/source/${archive}"
          cp "${RUNNER_TEMP}/repro/${archive}.sha512" "${RUNNER_TEMP}/source/${archive}.sha512"
          (
            cd "${RUNNER_TEMP}/source"
            shasum -a 512 --check "${archive}.sha512"
          )
          sha512="$(awk '{print $1}' "${RUNNER_TEMP}/source/${archive}.sha512")"
          {
            echo "commit=${commit}"
            echo "version=${version}"
            echo "archive=${archive}"
            echo "sha512=${sha512}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "Source ref: ${GITHUB_REF}"
            echo "Source commit: ${commit}"
            echo "Source version: ${version}"
            echo
            cat "${RUNNER_TEMP}/source/${archive}.sha512"
          } >> "${GITHUB_STEP_SUMMARY}"
      - id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  reproduce-macos:
    name: Verify macOS reproducibility
    if: github.event_name == 'pull_request'
    needs: compose
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate source artifact ID
        env:
          ARTIFACT_ID: ${{ needs.compose.outputs.artifact-id }}
        run: |
          case "${ARTIFACT_ID}" in
            "" | *[!0-9]*)
              echo "::error::Source artifact ID is missing or invalid: '${ARTIFACT_ID}'."
              exit 1
              ;;
          esac
      - name: Download Ubuntu source archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.compose.outputs.artifact-id }}
          path: ${{ runner.temp }}/ubuntu-source
          merge-multiple: true
      - name: Verify macOS vs Ubuntu parity
        env:
          COMMIT: ${{ needs.compose.outputs.commit }}
          VERSION: ${{ needs.compose.outputs.version }}
        run: |
          python3 release/scripts/compose_source.py \
            --revision "${COMMIT}" \
            --version "${VERSION}" \
            --output "${RUNNER_TEMP}/macos-repro" \
            --compare "${RUNNER_TEMP}/ubuntu-source"

  sign:
    name: Sign source release
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v') && github.repository == 'apache/reqsign'
    needs: compose
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: release
      url: https://releases.apache.org/projects/reqsign
    permissions:
      contents: read
    steps:
      - name: Validate source artifact ID
        env:
          ARTIFACT_ID: ${{ needs.compose.outputs.artifact-id }}
        run: |
          case "${ARTIFACT_ID}" in
            "" | *[!0-9]*)
              echo "::error::Source artifact ID is missing or invalid: '${ARTIFACT_ID}'."
              exit 1
              ;;
          esac
      - name: Download composed source archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.compose.outputs.artifact-id }}
          path: ${{ runner.temp }}/source
          merge-multiple: true
      - name: Verify signing key in ASF KEYS
        env:
          SIGNING_FINGERPRINT: ${{ secrets.SOURCE_SIGNING_FINGERPRINT || vars.SOURCE_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "${SIGNING_FINGERPRINT}" =~ ^([0-9A-F]{40}|[0-9A-F]{64})$ ]]; then
            echo "::error::SOURCE_SIGNING_FINGERPRINT must be a 40- or 64-character uppercase hex primary fingerprint."
            exit 1
          fi
          keys_gnupg="${RUNNER_TEMP}/keys-gnupg"
          rm -rf "${keys_gnupg}"
          mkdir -m 0700 -p "${keys_gnupg}"
          curl -fsSL https://downloads.apache.org/reqsign/KEYS -o "${RUNNER_TEMP}/KEYS"
          GNUPGHOME="${keys_gnupg}" gpg --batch --no-options --import "${RUNNER_TEMP}/KEYS"
          if ! GNUPGHOME="${keys_gnupg}" gpg --batch --no-options --with-colons --list-keys "${SIGNING_FINGERPRINT}" \
            | awk -F: '$1 == "fpr" { print $10 }' | grep -Fxq "${SIGNING_FINGERPRINT}"; then
            echo "::error::Signing fingerprint ${SIGNING_FINGERPRINT} was not found in https://downloads.apache.org/reqsign/KEYS."
            exit 1
          fi
      - id: gpg
        name: Import the ASF project key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_SECRET_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Sign and verify source archive
        env:
          ARCHIVE: ${{ needs.compose.outputs.archive }}
          IMPORTED_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
          SIGNING_FINGERPRINT: ${{ secrets.SOURCE_SIGNING_FINGERPRINT || vars.SOURCE_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ "${IMPORTED_FINGERPRINT}" != "${SIGNING_FINGERPRINT}" ]]; then
            echo "::error::The imported key (${IMPORTED_FINGERPRINT}) does not match SOURCE_SIGNING_FINGERPRINT (${SIGNING_FINGERPRINT})."
            exit 1
          fi
          cd "${RUNNER_TEMP}/source"
          shasum -a 512 --check "${ARCHIVE}.sha512"
          gpg --batch --armor --detach-sign --local-user "${SIGNING_FINGERPRINT}" "${ARCHIVE}"
          GNUPGHOME="${RUNNER_TEMP}/keys-gnupg" gpg --batch --no-options --no-auto-key-retrieve --status-fd 1 \
            --verify "${ARCHIVE}.asc" "${ARCHIVE}" \
            | awk -v fingerprint="${SIGNING_FINGERPRINT}" '
                $1 == "[GNUPG:]" && $2 == "GOODSIG" { good = 1 }
                $1 == "[GNUPG:]" && $2 == "VALIDSIG" && ($3 == fingerprint || $NF == fingerprint) { valid = 1 }
                END { exit !(good && valid) }
              '
          mkdir -p "${RUNNER_TEMP}/signed-source"
          cp "${ARCHIVE}" "${ARCHIVE}.sha512" "${ARCHIVE}.asc" "${RUNNER_TEMP}/signed-source/"
      - id: signed-bundle
        name: Upload signed source bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed-source/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
    outputs:
      artifact-id: ${{ steps.signed-bundle.outputs.artifact-id }}

  upload:
    name: Upload candidate to ATR
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v') && github.repository == 'apache/reqsign'
    needs: [compose, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate signed artifact ID
        env:
          ARTIFACT_ID: ${{ needs.sign.outputs.artifact-id }}
        run: |
          case "${ARTIFACT_ID}" in
            "" | *[!0-9]*)
              echo "::error::Signed artifact ID is missing or invalid: '${ARTIFACT_ID}'."
              exit 1
              ;;
          esac
      - name: Download signed source bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact-id }}
          path: ${{ runner.temp }}/signed-source
          merge-multiple: true
      - name: Verify signed source bundle
        env:
          VERSION: ${{ needs.compose.outputs.version }}
        run: |
          set -euo pipefail
          expected=(
            "apache-reqsign-${VERSION}.tar.gz"
            "apache-reqsign-${VERSION}.tar.gz.asc"
            "apache-reqsign-${VERSION}.tar.gz.sha512"
          )
          mapfile -t actual < <(find "${RUNNER_TEMP}/signed-source" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          if [[ "${#actual[@]}" -ne 3 ]] \
            || [[ "${actual[0]}" != "${expected[0]}" ]] \
            || [[ "${actual[1]}" != "${expected[1]}" ]] \
            || [[ "${actual[2]}" != "${expected[2]}" ]]; then
            echo "::error::Expected exact 3 signed release files (${expected[*]}), found: ${actual[*]}"
            exit 1
          fi
          (
            cd "${RUNNER_TEMP}/signed-source"
            shasum -a 512 --check "apache-reqsign-${VERSION}.tar.gz.sha512"
          )
      - name: Upload to ATR compose
        uses: apache/tooling-actions/upload-to-atr@fa721a0b176d713807b574da721b96545b587eea
        with:
          project: reqsign
          version: ${{ needs.compose.outputs.version }}
          src: ${{ runner.temp }}/signed-source
      - name: Record the candidate handoff
        env:
          SOURCE_COMMIT: ${{ needs.compose.outputs.commit }}
          VERSION: ${{ needs.compose.outputs.version }}
          ARCHIVE: ${{ needs.compose.outputs.archive }}
        run: |
          {
            echo "Uploaded candidate ${GITHUB_REF_NAME} (${SOURCE_COMMIT}) to ATR project reqsign, version ${VERSION}."
            echo
            cat "${RUNNER_TEMP}/signed-source/${ARCHIVE}.sha512"
            echo
            echo "Inspect ATR checks at https://releases.apache.org/projects/reqsign and record the candidate revision before starting a vote."
            echo "Inspect ATR before rerunning this workflow after an upload failure; the source artifact is retained for 30 days."
          } >> "${GITHUB_STEP_SUMMARY}"
