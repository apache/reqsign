name: Website

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".asf.yaml"
      - "website/**"
      - ".github/workflows/website.yml"
      # The provider catalog and included code snippets must stay in sync
      # with the workspace, so Rust-side changes also validate the website.
      - "Cargo.toml"
      - "reqsign/**"
      - "core/**"
      - "context/**"
      - "services/**"
  pull_request:
    branches:
      - main
    paths:
      - ".asf.yaml"
      - "website/**"
      - ".github/workflows/website.yml"
      - "Cargo.toml"
      - "reqsign/**"
      - "core/**"
      - "context/**"
      - "services/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # docusaurus.config.js resolves the released version from Git tags.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Compile website examples
        run: cargo check -p reqsign --examples --all-features

      - name: Validate provider catalog against cargo metadata
        working-directory: website
        run: node scripts/validate-providers.mjs

      - name: Build (fails on broken internal links)
        working-directory: website
        run: pnpm build

      - name: Check for third-party runtime assets
        working-directory: website
        run: node scripts/check-external-assets.mjs

      - name: Include ASF publishing configuration
        run: cp .asf.yaml website/build/.asf.yaml

      - name: Upload website
        uses: actions/upload-artifact@v7.0.1
        with:
          name: website
          path: website/build/
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated website
        uses: actions/download-artifact@v8.0.1
        with:
          name: website
          path: website/build

      - name: Publish to ASF
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: asf-site
          publish_dir: website/build
          # Keep the publication history so an earlier artifact can be recovered.
          enable_jekyll: false
