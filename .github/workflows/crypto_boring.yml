name: Crypto Boring

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "core/**"
      - "crypto/boring/**"
      - "crypto/rustcrypto/**"
      - "services/aws-core/**"
      - "services/aws-v4/**"
      - ".github/workflows/crypto_boring.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "core/**"
      - "crypto/boring/**"
      - "crypto/rustcrypto/**"
      - "services/aws-core/**"
      - "services/aws-v4/**"
      - ".github/workflows/crypto_boring.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Clippy
        run: cargo clippy --manifest-path crypto/boring/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path crypto/boring/Cargo.toml
      # BoringSSL's FIPS build runs its Go tools, and its go.mod requires Go
      # 1.27 while the runner images default to Go 1.26.
      - name: Install Go for the FIPS build
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ">=1.27.0"
          cache: false
      - name: Clippy (fips)
        run: cargo clippy --manifest-path crypto/boring/Cargo.toml --all-targets --features fips -- -D warnings
      - name: Test (fips)
        run: cargo test --manifest-path crypto/boring/Cargo.toml --features fips
